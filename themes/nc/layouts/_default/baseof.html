<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
{{- partial "head.html" . -}}
</head>
<body class="{{ if .IsHome }}home{{ else }}page{{ end }}">
<a class="skip" href="#main">{{ i18n "skip" }}</a>
{{- partial "header.html" . -}}
<main id="main">
{{- block "main" . }}{{ end -}}
</main>
{{- partial "footer.html" . -}}
<script>
(function(){
  var r=document.documentElement,b=document.getElementById('theme-toggle');
  if(b){b.addEventListener('click',function(){
    var cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var next=cur==='dark'?'light':'dark';r.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next)}catch(e){}
  });}
  var n=document.getElementById('nav-toggle'),m=document.getElementById('nav');
  if(n&&m){n.addEventListener('click',function(){
    var o=m.classList.toggle('open');n.setAttribute('aria-expanded',o);
  });}
})();
</script>
</body>
</html>
