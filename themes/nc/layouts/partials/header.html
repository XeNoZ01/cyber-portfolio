<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}">Nathan Charpentier</a>
    <button id="nav-toggle" class="icon-btn nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="{{ i18n "menu" }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav id="nav" class="nav" aria-label="Navigation">
      <ul>
      {{- $current := . -}}
      {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
      </ul>
      <div class="tools">
        {{- range .AllTranslations }}
          {{- if ne .Language.Lang site.Language.Lang }}
        <a class="lang" href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}" title="{{ .Language.LanguageName }}">{{ upper .Language.Lang }}</a>
          {{- end }}
        {{- end }}
        <button id="theme-toggle" class="icon-btn" aria-label="{{ i18n "theme" }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </nav>
  </div>
</header>
