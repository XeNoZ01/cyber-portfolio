<article class="card">
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  {{- if not .Date.IsZero }}<p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>{{ if eq .Params.case_study "fictive" }} · <span class="tag">{{ i18n "fictive_label" }}</span>{{ end }}</p>{{ end }}
  <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 190 }}{{ end }}</p>
  <a class="more" href="{{ .RelPermalink }}">{{ i18n "read_more" }} →</a>
</article>
